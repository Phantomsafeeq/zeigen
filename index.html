<html lang="en">
<head>

<title>ZEIGEN 2K26 — Paper Presentation | K.L.N. College of Engineering</title>
<meta name="description" content="ZEIGEN 2K26 — National Level Technical Symposium, Department of CSE, K.L.N. College of Engineering, Madurai." />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
--bg-deep:#060816;--bg-navy:rgba(10,14,28,.6);
--glass:rgba(255,255,255,.06);--glass-strong:rgba(13,20,38,.5);
--glass-border:rgba(255,255,255,.12);--glass-border-gold:rgba(245,184,46,.3);
--glass-blur:blur(24px) saturate(200%);--glass-blur-strong:blur(40px) saturate(220%);
--gold:#f5b82e;--gold-bright:#ffd75a;--gold-dim:#b8901f;
--text-primary:#fff;--text-secondary:#c8d0e0;--text-muted:#6b7896;
--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
--border-gold:rgba(245,184,46,.25);
--success:#22c55e;--warning:#f59e0b;--error:#ef4444;--info:#3b82f6;
--radius:16px;--radius-sm:12px;--radius-lg:24px;
--font-display:'Orbitron',sans-serif;--font-heading:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
--shadow-glass:0 8px 32px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.08);
--shadow-glass-hover:0 16px 48px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text-secondary);line-height:1.6;overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle 700px at 15% 15%,rgba(245,184,46,.14),transparent 60%),radial-gradient(circle 600px at 85% 85%,rgba(59,130,242,.12),transparent 60%),radial-gradient(circle 500px at 50% 60%,rgba(168,85,247,.08),transparent 60%),radial-gradient(circle 400px at 80% 10%,rgba(245,184,46,.08),transparent 60%);pointer-events:none;z-index:0;animation:orbShift 20s ease-in-out infinite alternate}
@keyframes orbShift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.05)}}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 0%,black 20%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,black 20%,transparent 80%);pointer-events:none;z-index:0}
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input,select,textarea{font-family:inherit}ul{list-style:none}
h1,h2,h3,h4{font-family:var(--font-heading);color:var(--text-primary);line-height:1.2;font-weight:600}
.text-gold{color:var(--gold)}.container{width:100%;max-width:1280px;margin:0 auto;padding:0 24px}
.section{padding:80px 0;position:relative}.section-sm{padding:48px 0}
.site-header{position:sticky;top:0;z-index:50;background:rgba(8,12,24,.55);backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);border-bottom:1px solid var(--glass-border);box-shadow:0 4px 24px rgba(0,0,0,.3),inset 0 -1px 0 rgba(255,255,255,.04)}
.header-inner{display:flex;align-items:center;gap:32px;padding:14px 24px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.05);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border-gold);display:flex;align-items:center;justify-content:center;color:var(--gold-bright);box-shadow:0 0 24px rgba(245,184,46,.15),inset 0 1px 0 rgba(255,255,255,.1)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--gold-bright);letter-spacing:.08em}
.brand-sub{font-size:9px;color:var(--text-muted);letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.nav{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.nav a{padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--text-secondary);border-radius:10px;transition:all .25s;letter-spacing:.02em;border:1px solid transparent}
.nav a:hover{color:var(--gold-bright);background:var(--glass);backdrop-filter:var(--glass-blur);border-color:var(--glass-border-gold)}
.nav a.active{color:var(--gold-bright);background:rgba(245,184,46,.08);backdrop-filter:var(--glass-blur);border-color:var(--glass-border-gold);box-shadow:0 0 20px rgba(245,184,46,.12)}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-size:13px;font-weight:600;border-radius:12px;transition:all .25s;letter-spacing:.04em;border:1px solid transparent;font-family:var(--font-body);white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold) 0%,#e0a31c 100%);color:#1a1408;box-shadow:0 4px 18px -4px rgba(245,184,46,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 28px -4px rgba(245,184,46,.65),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-ghost{background:var(--glass);backdrop-filter:var(--glass-blur);color:var(--text-primary);border:1px solid var(--border-strong);box-shadow:var(--shadow-glass)}
.btn-ghost:hover{border-color:var(--border-gold);color:var(--gold-bright);background:rgba(245,184,46,.06)}
.btn-outline{background:var(--glass);backdrop-filter:var(--glass-blur);color:var(--gold-bright);border:1px solid var(--border-gold);box-shadow:0 0 16px rgba(245,184,46,.08)}
.btn-outline:hover{background:rgba(245,184,46,.08);box-shadow:0 0 28px rgba(245,184,46,.18)}
.btn-danger{background:rgba(239,68,68,.08);backdrop-filter:var(--glass-blur);color:var(--error);border:1px solid rgba(239,68,68,.3)}.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-success{background:rgba(34,197,94,.08);backdrop-filter:var(--glass-blur);color:var(--success);border:1px solid rgba(34,197,94,.3)}.btn-success:hover{background:rgba(34,197,94,.15)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}.btn-lg{padding:14px 28px;font-size:14px;border-radius:14px}.btn-icon{padding:8px;border-radius:10px}.btn:disabled{opacity:.5;cursor:not-allowed}
.hamburger{display:none;flex-direction:column;gap:5px;padding:8px;border-radius:10px;border:1px solid var(--border-strong);background:var(--glass);backdrop-filter:var(--glass-blur)}
.hamburger span{width:20px;height:2px;background:var(--text-primary);transition:.3s}
.hamburger.active span:nth-child(1){transform:translateY(7px) rotate(45deg)}.hamburger.active span:nth-child(2){opacity:0}.hamburger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:14px 24px;background:rgba(8,12,24,.7);backdrop-filter:var(--glass-blur-strong);border-bottom:1px solid var(--glass-border)}.mobile-menu.open{display:flex}.mobile-menu a{padding:10px 14px;border-radius:10px;color:var(--text-secondary);font-weight:500}.mobile-menu a:hover{color:var(--gold-bright);background:var(--glass)}
.hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;padding:60px 24px 80px;overflow:hidden}
.hero-bg-rings{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.hero-bg-rings::before,.hero-bg-rings::after{content:'';position:absolute;border-radius:50%}
.hero-bg-rings::before{width:780px;height:780px;border:1px solid rgba(245,184,46,.06);box-shadow:inset 0 0 120px rgba(245,184,46,.03)}
.hero-bg-rings::after{width:1100px;height:1100px;border:1px solid rgba(255,255,255,.04)}
.hero-content{position:relative;z-index:2;text-align:center;max-width:920px;width:100%;animation:heroIn 1s cubic-bezier(.22,.61,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border-radius:50px;background:rgba(245,184,46,.06);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border-gold);color:var(--gold-bright);box-shadow:0 0 24px rgba(245,184,46,.1)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 8px var(--gold-bright)}
.badge-info{background:rgba(59,130,242,.06);border-color:rgba(59,130,242,.25);color:#7eb8ff}
.hero-title{font-family:var(--font-display);font-weight:900;font-size:clamp(48px,9vw,120px);line-height:1;letter-spacing:.04em;margin:24px 0 12px;background:linear-gradient(180deg,#fff 0%,#f5b82e 60%,#b8901f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 80px rgba(245,184,46,.2)}
.hero-subtitle{font-size:clamp(11px,1.4vw,14px);font-weight:600;letter-spacing:.32em;color:var(--text-muted);text-transform:uppercase;margin-bottom:32px}
.hero-paper-title{font-family:var(--font-heading);font-weight:700;font-size:clamp(28px,4vw,52px);color:#fff;letter-spacing:.02em;margin-bottom:14px}
.hero-tagline{font-size:clamp(14px,1.6vw,18px);color:var(--text-secondary);font-style:italic;margin-bottom:38px}
.info-badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:38px}
.info-badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:50px;background:var(--glass-strong);backdrop-filter:var(--glass-blur);border:1px solid var(--border-strong);box-shadow:var(--shadow-glass);font-size:13px;font-weight:500;color:var(--text-primary)}
.info-badge svg{color:var(--gold-bright);width:16px;height:16px}
.hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.section-header{text-align:center;max-width:760px;margin:0 auto 56px}
.section-eyebrow{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:14px}
.section-title{font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.01em;margin-bottom:16px}
.section-desc{font-size:16px;color:var(--text-muted)}
.card{background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:28px;transition:all .35s;position:relative;overflow:hidden;box-shadow:var(--shadow-glass)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);pointer-events:none}
.card:hover{border-color:var(--glass-border-gold);transform:translateY(-4px);box-shadow:var(--shadow-glass-hover),0 0 0 1px var(--glass-border-gold)}
.card-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(245,184,46,.15),rgba(245,184,46,.03));border:1px solid var(--glass-border-gold);display:flex;align-items:center;justify-content:center;color:var(--gold-bright);margin-bottom:18px;box-shadow:0 0 20px rgba(245,184,46,.1)}
.card-title{font-size:18px;font-weight:600;margin-bottom:8px;color:#fff}
.card-desc{font-size:14px;color:var(--text-muted);line-height:1.65}
.grid{display:grid;gap:24px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center}
.about-lead{font-size:18px;color:var(--text-primary);margin-bottom:18px;line-height:1.6}
.about-text{font-size:15px;color:var(--text-muted);margin-bottom:24px;line-height:1.75}
.about-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.about-stat{padding:20px;border-radius:var(--radius-sm);background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);box-shadow:var(--shadow-glass);transition:all .3s}
.about-stat:hover{border-color:var(--glass-border-gold);box-shadow:var(--shadow-glass-hover)}
.about-stat-num{font-family:var(--font-display);font-size:32px;color:var(--gold-bright);font-weight:700}
.about-stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.topic-card{position:relative;overflow:hidden;background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;transition:all .35s;box-shadow:var(--shadow-glass)}
.topic-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:.35s}
.topic-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);pointer-events:none}
.topic-card:hover{border-color:var(--glass-border-gold);transform:translateY(-4px);box-shadow:0 12px 36px -10px rgba(245,184,46,.15),var(--shadow-glass-hover)}
.topic-card:hover::before{opacity:1}
.topic-card-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,rgba(245,184,46,.14),rgba(245,184,46,.02));border:1px solid var(--glass-border-gold);color:var(--gold-bright);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 0 20px rgba(245,184,46,.1)}
.topic-card-name{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}
.topic-card-desc{font-size:13px;color:var(--text-muted);line-height:1.6}
.guideline-card{display:flex;gap:18px;position:relative;background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;transition:all .3s;box-shadow:var(--shadow-glass)}
.guideline-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);pointer-events:none}
.guideline-card:hover{border-color:var(--glass-border-gold);transform:translateY(-2px);box-shadow:var(--shadow-glass-hover)}
.guideline-num{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:rgba(245,184,46,.08);border:1.5px solid var(--gold);color:var(--gold-bright);font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(245,184,46,.15)}
.guideline-content{flex:1}.guideline-text{font-size:14px;color:var(--text-secondary);line-height:1.65}
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--gold),rgba(245,184,46,.1) 80%,transparent)}
.timeline-item{position:relative;padding-bottom:32px}.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg-deep);border:2px solid var(--gold);box-shadow:0 0 20px rgba(245,184,46,.5)}
.timeline-card{background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px 24px;transition:all .3s;box-shadow:var(--shadow-glass);position:relative}
.timeline-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);pointer-events:none}
.timeline-card:hover{border-color:var(--glass-border-gold);box-shadow:var(--shadow-glass-hover)}
.timeline-date{font-size:12px;color:var(--gold-bright);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.timeline-title{font-size:16px;color:#fff;font-weight:600;margin-top:4px}
.timeline-desc{font-size:13px;color:var(--text-muted);margin-top:6px}
.form-card{background:rgba(13,20,38,.45);backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow-glass),0 0 60px rgba(245,184,46,.04),inset 0 1px 0 rgba(255,255,255,.06);position:relative}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);border-radius:var(--radius-lg) var(--radius-lg) 0 0;pointer-events:none}
.form-section-title{font-family:var(--font-heading);font-size:16px;font-weight:600;color:#fff;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.form-section-title svg{color:var(--gold-bright)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary)}.form-label .req{color:var(--gold-bright)}
.form-input,.form-select,.form-textarea{background:rgba(255,255,255,.03);backdrop-filter:var(--glass-blur);border:1px solid var(--border-strong);border-radius:12px;padding:11px 14px;font-size:14px;color:#fff;transition:all .25s;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,46,.12),inset 0 1px 0 rgba(255,255,255,.05);background:rgba(255,255,255,.04)}
.form-input::placeholder{color:var(--text-muted)}.form-textarea{min-height:120px;resize:vertical}
.form-error{font-size:12px;color:var(--error);margin-top:2px;min-height:14px}.form-hint{font-size:12px;color:var(--text-muted)}
.form-group.has-error .form-input,.form-group.has-error .form-select{border-color:var(--error);box-shadow:0 0 0 3px rgba(239,68,68,.1)}
.file-drop{border:2px dashed var(--border-strong);border-radius:14px;padding:28px;text-align:center;background:rgba(255,255,255,.03);backdrop-filter:var(--glass-blur);transition:all .25s;cursor:pointer;box-shadow:var(--shadow-glass)}
.file-drop:hover,.file-drop.dragover{border-color:var(--gold);background:rgba(245,184,46,.04)}
.file-drop-icon{color:var(--gold-bright);margin-bottom:10px}.file-drop-text{font-size:14px;color:var(--text-secondary);margin-bottom:4px}.file-drop-hint{font-size:12px;color:var(--text-muted)}
.file-preview{display:flex;align-items:center;gap:14px;background:rgba(13,20,38,.5);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-glass)}
.file-preview-icon{color:var(--gold-bright)}.file-preview-info{flex:1}.file-preview-name{font-size:14px;color:#fff;font-weight:500}.file-preview-size{font-size:12px;color:var(--text-muted)}
.upload-progress{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:8px}
.upload-progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .3s;box-shadow:0 0 8px rgba(245,184,46,.3)}
.checkbox{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--glass-border);border-radius:12px;background:rgba(255,255,255,.04);backdrop-filter:var(--glass-blur);cursor:pointer;box-shadow:var(--shadow-glass)}
.checkbox input{margin-top:3px;width:16px;height:16px;accent-color:var(--gold)}.checkbox-text{font-size:13px;color:var(--text-secondary);line-height:1.6}
.data-table-wrap{background:rgba(13,20,38,.45);backdrop-filter:var(--glass-blur-strong);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-glass)}
.table-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.table-search{position:relative;flex:1;min-width:200px;max-width:320px}
.table-search input{width:100%;background:rgba(255,255,255,.03);backdrop-filter:var(--glass-blur);border:1px solid var(--border-strong);border-radius:10px;padding:9px 12px 9px 36px;color:#fff;font-size:13px}
.table-search input:focus{outline:none;border-color:var(--gold)}
.table-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)}

function renderHome(){return '<section class="hero"><div class="hero-bg-rings"></div><div class="hero-content"><div class="badge"><span class="badge-dot"></span>National Level Technical Symposium</div><h1 class="hero-title">ZEIGEN 2K26</h1><p class="hero-subtitle">Department of Computer Science and Engineering</p><h2 class="hero-paper-title">PAPER PRESENTATION</h2><p class="hero-tagline">"Present Ideas. Inspire Innovation. Shape the Future."</p><div class="info-badges"><div class="info-badge">'+IC.calendar+'28 August 2026 - Friday</div><div class="info-badge">'+IC.pin+'K.L.N. College of Engineering, Madurai</div><div class="info-badge">'+IC.users+'Max 2 Students / Team</div></div><div class="hero-ctas"><a href="#/submit" class="btn btn-gold btn-lg">'+IC.upload+' SUBMIT YOUR PAPER</a><a href="#/guidelines" class="btn btn-outline btn-lg">'+IC.list+' VIEW GUIDELINES</a></div></div></section><section class="section"><div class="container"><div class="section-header"><div class="section-eyebrow">Symposium Highlights</div><h2 class="section-title">A Stage for <span class="text-gold">Technical Excellence</span></h2><p class="section-desc">ZEIGEN 2K26 brings together the brightest minds in computer science to share ideas, demonstrate research, and build the future.</p></div><div class="grid grid-4">'+card({icon:'bulb',title:'Innovation',desc:'A platform to present breakthrough ideas and unconventional approaches to modern computing problems.'})+card({icon:'flask',title:'Research',desc:'An opportunity to showcase original research work and contribute to the broader academic community.'})+card({icon:'cpu',title:'Technology',desc:'Explore the frontier of technology through AI, cloud, security, blockchain, and emerging paradigms.'})+card({icon:'msg',title:'Knowledge Sharing',desc:'Engage with peers, faculty, and industry minds to refine ideas and build meaningful connections.'})+'</div></div></section><section class="section"><div class="container"><div class="grid grid-3"><div class="card" style="text-align:center"><div class="card-icon" style="margin:0 auto 18px">'+IC.layers+'</div><div style="font-family:var(--font-display);font-size:36px;color:var(--gold-bright);font-weight:700">15</div><div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px">Technical Domains</div></div><div class="card" style="text-align:center"><div class="card-icon" style="margin:0 auto 18px">'+IC.building+'</div><div style="font-family:var(--font-display);font-size:36px;color:var(--gold-bright);font-weight:700">50+</div><div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px">Participating Colleges</div></div><div class="card" style="text-align:center"><div class="card-icon" style="margin:0 auto 18px">'+IC.spark+'</div><div style="font-family:var(--font-display);font-size:36px;color:var(--gold-bright);font-weight:700">20MB</div><div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px">Max File Size</div></div></div></div></section>';}

function renderAbout(){return '<section class="section"><div class="container"><div class="section-header"><div class="section-eyebrow">About The Event</div><h2 class="section-title">About <span class="text-gold">ZEIGEN 2K26</span></h2><p class="section-desc">A national-level platform celebrating technical thought leadership and student innovation.</p></div><div class="about-grid"><div><p class="about-lead">ZEIGEN 2K26 is the flagship National Level Technical Symposium organized by the Department of Computer Science and Engineering at K.L.N. College of Engineering, Madurai.</p><p class="about-text">The Paper Presentation event invites undergraduate and postgraduate students from across the country to present innovative ideas, share technical knowledge, and engage with peers and faculty on the most pressing and exciting problems in modern computing.</p><p class="about-text">Our purpose is to cultivate a research mindset, encourage students to explore emerging technologies, and provide a respected stage where original work is recognized. From artificial intelligence to quantum computing, ZEIGEN 2K26 covers the full spectrum of contemporary computer science.</p><p class="about-text">Selected teams will present their work before a distinguished judging panel on <span class="text-gold">28 August 2026</span> at K.L.N. College of Engineering.</p></div><div class="about-stats"><div class="about-stat"><div class="about-stat-num">15</div><div class="about-stat-label">Technical Domains</div></div><div class="about-stat"><div class="about-stat-num">2</div><div class="about-stat-label">Max Team Size</div></div><div class="about-stat"><div class="about-stat-num">20MB</div><div class="about-stat-label">Max File Size</div></div><div class="about-stat"><div class="about-stat-num">28.08</div><div class="about-stat-label">Event Date 2026</div></div></div></div></div></section><section class="section-sm"><div class="container"><div class="grid grid-4">'+card({icon:'bulb',title:'Innovation',desc:'A platform for breakthrough ideas and unconventional approaches.'})+card({icon:'flask',title:'Research',desc:'Original contributions to the broader academic community.'})+card({icon:'cpu',title:'Technology',desc:'Frontier exploration across modern computing paradigms.'})+card({icon:'msg',title:'Knowledge',desc:'Meaningful exchange between students, faculty, and industry.'})+'</div></div></section>';}

n removeFile(type){if(type==='ppt'){uploadState.file=null;fileDrop.style.display='block';filePreview.style.display='none';filePreview.innerHTML='';fileInput.value='';}else{ieeeState.file=null;ieeeDrop.style.display='block';ieeePreview.style.display='none';ieeePreview.innerHTML='';ieeeInput.value='';}}

ad your PPT file.';hasError=true;}var selTopic=topics.find(function(t){return t.name===data.domain;});var ieeeReq=selTopic?selTopic.ieeeRequired:false;if(ieeeReq&&!ieeeState.file){ieeeFileError.textContent='IEEE conference paper is required for this topic.';hasError=true;}if(!document.getElementById('confirmCheck').checked){document.getElementById('confirmBox').style.borderColor='var(--error)';toast('Please confirm the declaration checkbox.','error');hasError=true;}else{document.getElementById('confirmBox').style.borderColor='var(--border)';}if(hasError){toast('Please correct the highlighted fields.','error');return;}var existingStudents=DB.getStudents();var allRegs=existingStudents.map(function(x){return x.registerNumber;});if(allRegs.indexOf(data.s1_reg)!==-1){setError('s1_reg','This register number is already registered.');toast('Duplicate register number detected.','error');return;}if(data.s2_reg&&allRegs.indexOf(data.s2_reg)!==-1){setError('s2_reg','This register number is already registered.');toast('Duplicate register number detected.','error');return;}var btn=document.getElementById('submitBtn');btn.disabled=true;btn.innerHTML='<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> SUBMITTING...';if(!document.getElementById('spinStyle')){var st=document.createElement('style');st.id='spinStyle';st.textContent='@keyframes spin{to{transform:rotate(360deg)}}';document.head.appendChild(st);}var teamId=DB.nextTeamId();FileStore.save(teamId,uploadState.file).then(function(){var ieeePromise=ieeeState.file?FileStore.save(teamId+'_ieee',ieeeState.file):Promise.resolve(true);return ieeePromise;}).then(function(){var teams=DB.getTeams();var students=DB.getStudents();var newTeam={id:Date.now(),teamId:teamId,paperTitle:data.paperTitle.trim(),domain:data.domain,college:data.college.trim(),submissionDate:new Date().toISOString(),status:'pending',pptFile rd.';btn.disabled=false;btn.innerHTML=IC.lock+' SIGN IN';return;}sessionStorage.removeItem('z2k26_attempts');sessionStorage.removeItem('z2k26_last_attempt');sessionStorage.setItem('z2k26_authed','1');State.isAuthed=true;navigate('/admin/dashboard');};}

ss="form-label">IEEE Paper Formats</label><input type="text" class="form-input" name="ieeeAllowedFormats" value="'+s.ieeeAllowedFormats+'" /></div><div class="form-group"><label class="form-label">Contact Email</label><input type="email" class="form-input" name="contactEmail" value="'+s.contactInfo.email+'" /></div></div><div class="form-group"><label class="form-label">Event Description</label><textarea class="form-textarea" name="eventDescription">'+s.eventDescription+'</textarea></div><div class="form-group"><label class="form-label">Contact Phone</label><input type="text" class="form-input" name="contactPhone" value="'+s.contactInfo.phone+'" /></div><div class="form-group"><label class="form-label">Contact Address</label><textarea class="form-textarea" name="contactAddress">'+s.contactInfo.address+'</textarea></div><button type="submit" class="btn btn-gold btn-sm">'+IC.check+' Save Changes</button></form></div><div class="settings-card"><div class="settings-card-title">'+IC.layers+' Topics Management</div><div class="settings-card-desc">Add, edit, or remove presentation topics. All listed topics require IEEE paper.</div><form id="addTopicForm" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><input type="text" class="form-input" name="name" placeholder="Topic name" style="flex:1;min-width:140px" required /><select class="form-select" name="icon" style="width:auto">'+iconKeys.map(function(i){return'<option value="'+i+'">'+i+'</option>';}).join('')+'</select><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);cursor:pointer"><input type="checkbox" name="ieeeRequired" style="accent-color:var(--gold)" checked /> IEEE Required</label><button type="submit" class="btn btn-gold btn-sm">'+IC.plus+' Add</button></form><div style="max-height:300px;overflow-y:auto">'+topics.map(function(t){return'<div class="list-item"><div class="list-item-text">'+t.name+(t.active?'':' (inactive)')+(t.ieeeRequired?' <span style="color:var(--gold-bright);font-size:11px">[IEEE]</span>':'')+'</div><div class="list-item-actions"><button onclick="toggleTopic('+t.id+')" title="'+(t.active?'Deactivate':'Activate')+'">'+IC.eye+'</button><button onclick="deleteTopic('+t.id+')" title="Delete">'+IC.trash+'</button></div></div>';}).join('')+'</div></div><div class="settings-card"><div class="settings-card-title">'+IC.list+' Guidelines Management</div><div class="settings-card-desc">Manage the rules shown to participants.</div><form id="addGuidelineForm" style="display:flex;gap:8px;margin-bottom:14px"><input type="text" class="form-input" name="content" placeholder="Guideline text" required style="flex:1" /><button type="submit" class="btn btn-gold btn-sm">'+IC.plus+' Add</button></form><div style="max-height:300px;overflow-y:auto">'+guidelines.map(function(g){return'<div class="list-item"><div class="guideline-num" style="width:28px;height:28px;font-size:13px">'+g.number+'</div><div class="list-item-text" style="font-size:13px">'+g.content+'</div><div class="list-item-actions"><button onclick="deleteGuideline('+g.id+')" title="Delete">'+IC.trash+'</button></div></div>';}).join('')+'</div></div><div class="settings-card"><div class="settings-card-title">'+IC.calendar+' Important Dates</div><div class="settings-card-desc">Manage the timeline of milestones.</div><form id="addDateForm" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><input type="text" class="form-input" name="title" placeholder="Milestone title" required style="flex:1;min-width:140px" /><input type="date" class="form-input" name="date" required style="width:auto" /><button type="submit" class="btn btn-gold btn-sm">'+IC.plus+' Add</button></form><div style="max-height:300px;overflow-y:auto">'+dates.map(function(d){return'<div class="list-item"><div class="list-item-text"><strong>'+d.title+'</strong> - '+new Date(d.date).toLocaleDateString()+'<br><span style="font-size:12px;color:var(--text-muted)">'+d.desc+'</span></div><div class="list-item-actions"><button onclick="deleteDate('+d.id+')" title="Delete">'+IC.trash+'</button></div></div>';}).join('')+'</div></div><div class="settings-card" style="grid-column:1/-1"><div class="settings-card-title">'+IC.lock+' Change Password</div><div class="settings-card-desc">Set a new administrator password. You will be logged out after change.</div><form id="changePwdForm" style="max-width:480px"><div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-input" name="current" required /></div><div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-input" name="newPwd" required minlength="6" /></div><div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" class="form-input" name="confirm" required minlength="6" /></div><button type="submit" class="btn btn-gold btn-sm">'+IC.lock+' Update Password</button></form></div></div>';}

function bindSettings(){var cfg=document.getElementById('eventConfigForm');if(cfg)cfg.onsubmit=function(e){e.preventDefault();var fd=new FormData(cfg);var s=DB.getSettings();s.eventName=fd.get('eventName');s.eventDate=fd.get('eventDate');s.venue=fd.get('venue');s.registrationDeadline=fd.get('registrationDeadline');s.submissionDeadline=fd.get('submissionDeadline');s.maxTeamSize=parseInt(fd.get('maxTeamSize'));s.maxFileSize=parseInt(fd.get('maxFileSize'));s.allowedFormats=fd.get('allowedFormats');s.ieeeAllowedFormats=fd.get('ieeeAllowedFormats');s.eventDescription=fd.get('eventDescription');s.contactInfo.email=fd.get('contactEmail');s.contactInfo.phone=fd.get('contactPhone');s.contactInfo.address=fd.get('contactAddress');DB.setSettings(s);toast('Settings saved successfully.','success');};var tf=document.getElementById('addTopicForm');if(tf)tf.onsubmit=function(e){e.preventDefault();var fd=new FormData(tf);var topics=DB.getTopics();var id=Math.max.apply(null,[0].concat(topics.map(function(t){return t.id;})))+1;topics.push({id:id,name:fd.get('name'),desc:'Custom topic added by admin.',icon:fd.get('icon'),active:true,ieeeRequired:fd.get('ieeeRequired')==='on'});DB.setTopics(topics);toast('Topic added.','success');tf.reset();document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};var gf=document.getElementById('addGuidelineForm');if(gf)gf.onsubmit=function(e){e.preventDefault();var fd=new FormData(gf);var guidelines=DB.getGuidelines();var id=Math.max.apply(null,[0].concat(guidelines.map(function(g){return g.id;})))+1;var order=Math.max.apply(null,[0].concat(guidelines.map(function(g){return g.order;})))+1;guidelines.push({id:id,number:order,content:fd.get('content'),order:order});DB.setGuidelines(guidelines);toast('Guideline added.','success');gf.reset();document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};var df=document.getElementById('addDateForm');if(df)df.onsubmit=function(e){e.preventDefault();var fd=new FormData(df);var dates=DB.getDates();var id=Math.max.apply(null,[0].concat(dates.map(function(d){return d.id;})))+1;var order=Math.max.apply(null,[0].concat(dates.map(function(d){return d.order;})))+1;dates.push({id:id,title:fd.get('title'),date:fd.get('date'),desc:'Custom milestone.',order:order});DB.setDates(dates);toast('Date added.','success');df.reset();document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};var pf=document.getElementById('changePwdForm');if(pf)pf.onsubmit=function(e){e.preventDefault();var fd=new FormData(pf);var current=fd.get('current');var npw=fd.get('newPwd');var cfm=fd.get('confirm');if(npw!==cfm){toast('New passwords do not match.','error');return;}if(npw.length<6){toast('Password must be at least 6 characters.','error');return;}if(!DB.verifyPassword(current)){toast('Current password is incorrect.','error');return;}DB.changePassword(npw);toast('Password updated. Please log in again.','success');setTimeout(function(){sessionStorage.removeItem('z2k26_authed');State.isAuthed=false;navigate('/admin/login');},1200);};}
window.toggleTopic=function(id){var topics=DB.getTopics();var t=topics.find(function(x){return x.id===id;});if(t){t.active=!t.active;DB.setTopics(topics);toast('Topic '+(t.active?'activated':'deactivated')+'.','success');}document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};
window.deleteTopic=function(id){if(!confirm('Delete this topic?'))return;DB.setTopics(DB.getTopics().filter(function(t){return t.id!==id;}));toast('Topic deleted.','success');document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};
window.deleteGuideline=function(id){if(!confirm('Delete this guideline?'))return;var g=DB.getGuidelines().filter(function(x){return x.id!==id;});g=g.map(function(x,i){return Object.assign({},x,{number:i+1,order:i+1});});DB.setGuidelines(g);toast('Guideline deleted.','success');document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};
window.deleteDate=function(id){if(!confirm('Delete this date?'))return;var d=DB.getDates().filter(function(x){return x.id!==id;});d=d.map(function(x,i){return Object.assign({},x,{order:i+1});});DB.setDates(d);toast('Date deleted.','success');document.querySelector('.admin-content').innerHTML=renderSettings();bindSettings();};
function initParticles(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;var canvas=document.getElementById('particle-canvas');if(!canvas)return;var ctx=canvas.getContext('2d');var particles=[];var w,h;function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);var count=Math.min(50,Math.floor(w/30));for(var i=0;i<count;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+0.4,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,a:Math.random()*0.5+0.2});}function draw(){ctx.clearRect(0,0,w,h);particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(245, 184, 46, '+p.a+')';ctx.shadowBlur=8;ctx.shadowColor='rgba(245, 184, 46, 0.4)';ctx.fill();ctx.shadowBlur=0;});requestAnimationFrame(draw);}draw();}


// ── Email notification (Web3Forms — sends real file attachments) ───────────────

function formatBytes(bytes) {
  if (!bytes || bytes < 1024) return (bytes || 0) + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function buildSubject(paperTitle, teamName) {
  var base = '[ZEIGEN 2K26] New Submission \u2014 ' + (paperTitle || '') + ' | ' + (teamName || '');
  if (base.length <= 100) return base;
  return base.slice(0, 97) + '...';
}

function sendSubmissionNotification(record, pptFile, ieeeFile) {
  if (!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY === 'YOUR_WEB3FORMS_ACCESS_KEY') {
    console.warn('[ZEIGEN] Web3Forms access key not set \u2014 skipping email notification');
    return Promise.resolve();
  }

  var teamName     = record.teamName || record.s1_name || '';
  var members      = record.members  || [];
  var membersDetail = members.map(function(m, i) {
    return (i + 1) + '. ' + (m.name || '-') + ' | Reg: ' + (m.reg || '-') + ' | ' + (m.email || '-') + ' | ' + (m.phone || '-');
  }).join('\n');

  var subject = buildSubject(record.paperTitle || '', teamName);

  var body = [
    '=== ZEIGEN 2K26 — New Paper Submission ===',
    '',
    '--- Team Details ---',
    'Team ID     : ' + (record.teamId || ''),
    'Team Name   : ' + teamName,
    'College     : ' + (record.college || ''),
    'Members     : ' + (members.length || 1),
    '',
    membersDetail,
    '',
    '--- Paper Details ---',
    'Title  : ' + (record.paperTitle || ''),
    'Domain : ' + (record.domain     || ''),
    'Date   : ' + (record.submissionDate
      ? new Date(record.submissionDate).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })
      : new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })),
    '',
    '--- File Details ---',
    'PPT File  : ' + (pptFile  ? pptFile.name  + ' (' + formatBytes(pptFile.size)  + ')' : 'N/A'),
    'IEEE File : ' + (ieeeFile ? ieeeFile.name + ' (' + formatBytes(ieeeFile.size) + ')' : 'Not uploaded'),
    '',
    '=== End of Submission Details ==='
  ].join('\n');

  var fd = new FormData();
  fd.append('access_key',  WEB3FORMS_ACCESS_KEY);
  fd.append('to',          'paperwands2026@gmail.com');
  fd.append('subject',     subject);
  fd.append('message',     body);
  fd.append('from_name',   'ZEIGEN 2K26 Submissions');

  if (pptFile)  fd.append('attachment',  pptFile,  pptFile.name);
  if (ieeeFile) fd.append('attachment2', ieeeFile, ieeeFile.name);

  return fetch('https://api.web3forms.com/submit', { method: 'POST', body: fd })
    .then(function(res) {
      if (!res.ok) throw new Error('Web3Forms responded with status ' + res.status);
      return res.json();
    })
    .then(function(json) {
      if (!json.success) throw new Error(json.message || 'Web3Forms error');
    });
}
// ── End email notification ─────────────────────────────────────────────────────
